name: NeoFL source sync (manual)

on:
  workflow_dispatch:

# The neofl-gpt repository is an independently evolving product built from
# the canonical NeoFL infrastructure. Automatic rsync was intentionally
# removed because it deleted neofl-gpt extensions and caused recursive/failed
# workflow runs. Source synchronization is now an explicit manual operation.

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check canonical source
        run: |
          git ls-remote https://github.com/neofinn/neofl.git HEAD
          echo "Canonical NeoFL source is reachable. Manual sync is required to change this repository."
