name: NeoFL Parallel CI

on:
  push:
    branches: [neoflgpt-parallel]
  pull_request:
    branches: [neoflgpt-parallel]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neofl-parallel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-room:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install
      - name: Build Control Room
        run: npm run build

  python-gateway:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/python
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python gateway source
        run: |
          set -euxo pipefail
          echo "CI commit: $(git rev-parse HEAD)"
          echo "CI branch: $(git branch --show-current || true)"
          test -f python/neofl_gateway/__init__.py
          test -f python/neofl_gateway/agent.py
          python -m py_compile python/neofl_gateway/agent.py
      - name: Verify gateway import
        run: python -c "from neofl_gateway.agent import AgentLoop, AgentRequest; print('NeoFL gateway import OK')"
      - name: Compile all Python
        run: python -m compileall -q python tests
      - name: Run all Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
