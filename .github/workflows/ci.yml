name: NeoFL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neofl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-room:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install
      - name: Build Control Room
        run: npm run build

  python-gateway:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/python
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify checkout and Python gateway imports
        run: |
          set -euxo pipefail
          echo "CI commit: $(git rev-parse HEAD)"
          echo "CI branch: $(git branch --show-current || true)"
          git status --short
          test -f python/neofl_gateway/__init__.py
          test -f python/neofl_gateway/agent.py
          python -m py_compile python/neofl_gateway/agent.py
          python -c "import sys; print('Python:', sys.version); print('PYTHONPATH:', sys.path); from neofl_gateway.agent import AgentLoop, AgentRequest; print('NeoFL gateway import OK')"

      - name: Compile Python gateway and tests
        run: python -m compileall -q python tests

      - name: Run Python gateway test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
