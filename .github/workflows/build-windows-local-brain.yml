name: Build NeoFLGPT Parallel Windows App

on:
  push:
    branches: [neoflgpt-parallel]
    paths:
      - 'desktop/**'
      - 'python/neofl_gateway/local_brain.py'
      - '.github/workflows/build-windows-local-brain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: neoflgpt-parallel
          clean: true
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build desktop EXE
        shell: pwsh
        run: |
          pyinstaller --noconsole --onefile --clean --name NeoFLGPT_Parallel_Local desktop/NeoFLGPT_Parallel_Local_GUI.py
      - name: Smoke test artifact
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/NeoFLGPT_Parallel_Local.exe')) { throw 'EXE was not produced' }
          Get-Item 'dist/NeoFLGPT_Parallel_Local.exe' | Format-List Name,Length,FullName
      - name: Package installer payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item 'dist/NeoFLGPT_Parallel_Local.exe' 'release/NeoFLGPT_Parallel_Local.exe'
          @'
          NeoFLGPT Parallel Local

          This is the Windows desktop chat application. It uses a real local model runtime.
          Install a local Ollama-compatible model and configure NEOFL_LOCAL_MODEL, or use the GGUF backend.
          The EXE does not contain fabricated model weights or remote credentials.
          '@ | Set-Content -Encoding UTF8 release/README.txt
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: NeoFLGPT-Parallel-Local-Windows
          path: release/
          if-no-files-found: error
          retention-days: 30
