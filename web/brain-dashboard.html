<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NeoFL Brain Control</title><style>body{font-family:system-ui;background:#0b1020;color:#eef2ff;margin:0;padding:24px}main{max-width:1200px;margin:auto}h1{margin-bottom:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{background:#151d33;border:1px solid #2b3758;border-radius:14px;padding:18px}.ok{color:#6ee7b7}.bad{color:#fb7185}.muted{color:#94a3b8}select,button{background:#0f172a;color:#fff;border:1px solid #475569;border-radius:8px;padding:8px}button{cursor:pointer}.row{display:flex;justify-content:space-between;gap:12px;margin:8px 0}.pill{padding:3px 8px;border-radius:999px;background:#1e293b}.mono{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}</style></head><body><main><h1>NeoFL Brain Control</h1><div class="muted">Account routing • MT5 communication • MCP connectivity</div><br><div id="accounts" class="grid"></div></main><script>
const token=localStorage.getItem('neofl_admin_api_key')||'';
async function get(path){const r=await fetch(path,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error(r.status);return r.json()}
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(data)});if(!r.ok)throw Error(await r.text());return r.json()}
function esc(x){return String(x??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
async function render(){try{const [s,b]=await Promise.all([get('/mt5/status'),get('/admin/brains')]);const deployments=b.deployments||{};const accounts=s.accounts||{};document.getElementById('accounts').innerHTML=Object.entries(accounts).map(([id,a])=>{const options=Object.keys(deployments).map(n=>`<option value="${esc(n)}" ${a.brain===n?'selected':''}>${esc(n)}</option>`).join('');return `<section class="card"><div class="row"><b>Account ${esc(id)}</b><span class="pill ${a.communication==='ONLINE'?'ok':'bad'}">${esc(a.communication)}</span></div><div class="row"><span>Brain</span><select id="b-${esc(id)}">${options}</select></div><div class="row"><span>Branch</span><span class="mono">${esc(a.branch||'—')}</span></div><div class="row"><span>Build</span><span class="mono">${esc(a.build||'—')}</span></div><div class="row"><span>MCP</span><span>${esc(a.mcp?.status||'UNKNOWN')}</span></div><div class="row"><span>MCP endpoint</span><span class="mono">${esc(a.mcp?.endpoint||'—')}</span></div><div class="row"><span>Equity</span><span>${esc(a.equity||'—')}</span></div><button onclick="switchBrain('${esc(id)}')">Switch Brain</button></section>`}).join('')||'<section class="card">No MT5 accounts reporting yet.</section>'}catch(e){document.getElementById('accounts').innerHTML='<section class="card bad">Dashboard API unavailable: '+esc(e.message)+'</section>'}}
async function switchBrain(id){const deployment=document.getElementById('b-'+id).value;await post('/admin/brain/switch',{account_id:id,brain:deployment});await render()}
render();setInterval(render,5000);
</script></body></html>
