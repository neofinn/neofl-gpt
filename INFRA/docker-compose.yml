services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neofl}
      POSTGRES_USER: ${POSTGRES_USER:-neofl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - neofl_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neofl} -d ${POSTGRES_DB:-neofl}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - neofl_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - neofl_ollama:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      NEOFL_REASONING_MODEL: ${NEOFL_REASONING_MODEL:-qwen3:8b}
    entrypoint: ["/bin/sh", "-lc"]
    command: ["ollama pull \"$${NEOFL_REASONING_MODEL}\""]

  gateway:
    build:
      context: ..
      dockerfile: INFRA/Dockerfile
    restart: unless-stopped
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NEOFL_GATEWAY_TOKEN: ${NEOFL_GATEWAY_TOKEN:?set NEOFL_GATEWAY_TOKEN}
      NEOFL_REASONER: ${NEOFL_REASONER:-ollama}
      NEOFL_REASONING_MODEL: ${NEOFL_REASONING_MODEL:-qwen3:8b}
      NEOFL_OLLAMA_URL: ${NEOFL_OLLAMA_URL:-http://ollama:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8787}:8787"
    volumes:
      - neofl_gateway_state:/app/state

volumes:
  neofl_postgres:
  neofl_redis:
  neofl_ollama:
  neofl_gateway_state:
